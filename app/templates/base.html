<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t("app.name") }}{% endblock %}</title>
{% if lang == 'fa' %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
{% endif %}
<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --ink: #1B2433;
    --muted: #5B6576;
    --line: #D6DCE3;
    --accent: #1F5F8B;
    --accent-ink: #FFFFFF;
    --danger: #A63D32;
    --wait: #9A6413;
    --wait-bg: #FBF1DE;
    --ok-bg: #E3EFE6;
    --ok-ink: #2D6A3E;
    --err-bg: #F7E3E0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  html[lang="fa"] body { font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; line-height: 1.75; }
  a { color: var(--accent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
  .wrap.narrow { max-width: 820px; }
  @media (max-width: 520px) { .wrap { padding-inline: 12px; } }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 24px;
  }
  header.top h1 { font-size: 22px; font-weight: 700; margin: 0; }
  header.top h1 a { color: inherit; text-decoration: none; }
  .account { color: var(--muted); font-size: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button, .btn {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 8px 16px; border-radius: 8px; text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--muted); }
  button:focus-visible, .btn:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { background: #174a6d; border-color: #174a6d; }
  .btn-danger { color: var(--danger); }
  .btn-link { border: none; background: none; color: var(--muted); padding: 4px 0; }
  form.inline { display: inline; margin: 0; }
  .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
  .flash.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .flash.error { background: var(--err-bg); color: var(--danger); }
  .ltr-auto { unicode-bidi: plaintext; }
  .badge { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 10px; background: var(--wait-bg); color: var(--wait); margin-inline-start: 8px; vertical-align: middle; }
  .badge.sent { background: var(--ok-bg); color: var(--ok-ink); }
  .badge.rejected, .badge.failed { background: var(--err-bg); color: var(--danger); }
  .badge.info, .badge.done { background: #E4EEF5; color: var(--accent); }
  .ev-card.cancelled { border-color: #E3C3BE; background: #FCF6F5; }
  .ev-card.cancelled .ev-title-line { text-decoration: line-through; color: var(--muted); }
  .ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 16px; }
  .ev-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
  .ev-card.added { border-color: #BFD9C6; background: #F6FBF7; }
  .ev-src { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .ev-card label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .ev-card input[type=text], .ev-card input[type=date], .ev-card input[type=time], .ev-card textarea {
    width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface); color: var(--ink); unicode-bidi: plaintext;
  }
  .ev-card textarea { min-height: 56px; resize: vertical; }
  .ev-card input[type=date], .ev-card input[type=time] { direction: ltr; unicode-bidi: normal; text-align: start; }
  .ev-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
  .ev-row label { margin-top: 10px; }
  .ev-note { font-size: 13px; border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
  .ev-note.warn { background: var(--wait-bg); color: var(--wait); }
  .ev-note.clash { background: var(--err-bg); color: var(--danger); }
  .ev-check { display: flex !important; gap: 8px; align-items: center; color: var(--ink) !important; font-size: 13px !important; margin-top: 12px !important; }
  .ev-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .ev-done { font-size: 14px; }
  .ev-done strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .lang-switch { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .lang-switch button { padding: 2px 4px; }
  .lang-switch button.active { color: var(--ink); font-weight: 700; }
  footer.app-foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted); display: flex; gap: 12px; justify-content: center; }
  footer.app-foot a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap {% block wrapclass %}{% endblock %}">
  {% block body %}{% endblock %}
  <footer class="app-foot">
    <span>{{ t("app.version", version=APP_VERSION) }}</span>
    {% if request and request.session.get("auth") %}<a href="/changelog">{{ t("nav.changelog") }}</a>{% endif %}
  </footer>
</div>
</body>
</html>
